[project]
name = "spanguard"
version = "0.1.0"
description = "Span-level prompt-injection guard for AI agent tool traffic: strip the attack, keep the data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nabid Nur Abrar" }]
keywords = ["prompt-injection", "ai-agents", "security", "llm", "gateway", "meta"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
model = ["transformers>=4.44", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
spanguard = "spanguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spanguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Kaggle kernel scripts: notebook-style linear I/O with paths/log lines; context
# managers buy nothing there and would churn committed kernel code.
"training/**/*.py" = ["SIM115"]
"eval/fixtures/*.py" = ["SIM115"]
"src/spanguard/eval/cli.py" = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
