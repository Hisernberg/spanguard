[project]
name = "spanguard"
version = "0.1.0"
description = "Span-level prompt-injection guard for AI agent tool traffic: strip the attack, keep the data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nabid Nur Abrar" }]
keywords = ["prompt-injection", "ai-agents", "security", "llm", "gateway", "meta"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
model = ["transformers>=4.44", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
spanguard = "spanguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
